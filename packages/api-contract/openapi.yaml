      tags:
        - upload
      description: 商品图片上传（W7-feature）。multipart/form-data，field name="file"。支持
        jpg/png/webp，size ≤ 5MB，服务端校验 magic bytes（防 mime 伪造）。
      responses:
        "200":
          description: 上传成功，返回公开 URL + key + size
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  key:
                    type: string
                  size:
                    type: integer
                    minimum: 0
                required:
                  - url
                  - key
                  - size
        "400":
          description: E-UPLOAD-001 不支持的 mime / 空文件 / magic bytes 不匹配
          content:
            application/json:
              schema:
