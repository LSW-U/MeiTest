                    type: number
                    minimum: -90
                    maximum: 90
                  lng:
                    type: number
                    minimum: -180
                    maximum: 180
                  source:
                    type: string
                    enum: *a58
                  formattedAddress:
                    type: string
                    nullable: true
                required:
                  - lat
                  - lng
                  - source
                  - formattedAddress
        "400":
          description: E-COMMON-001 校验失败（address 长度 2-500），details 含 zod 具体 message
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        pattern: ^E-[A-Z]+-\d{3}$|^E-HTTP-\d{3}$
                      message:
                        type: string
                      details:
                        type: object
                        additionalProperties:
                          nullable: true
                    required:
                      - code
                      - message
                required:
                  - success
                  - error
