openapi: 3.0.3
info:
  title: MeiMart API
  version: "0.3"
  description: MeiMart 三端统一后端 API（契约 v0.2 基础 + v0.3 决策覆盖）
servers:
  - url: http://localhost:3000/api/v1
    description: dev
  - url: https://staging-api.meimart.xxx/api/v1
    description: staging
tags:
  - name: auth
    description: 认证模块
  - name: user
    description: 用户资料
  - name: address
    description: 收货地址
  - name: favorite
    description: 收藏
  - name: notification
    description: 站内通知
  - name: shop
    description: 商家（单一）
  - name: warehouse
    description: 仓库（多）
  - name: product
    description: 商品
  - name: sku
    description: 商品规格 SKU
  - name: category
    description: 商品分类
  - name: banner
    description: 首页 Banner
  - name: inventory
    description: 库存（含仓库匹配）
  - name: pricing
    description: 配送费 + 起送价
  - name: cart
    description: 购物车
  - name: order
    description: 订单
  - name: payment
    description: 支付
  - name: platform
    description: 平台 dashboard / 审计 / 系统配置
  - name: settle
    description: 结算单 + 提现审核（M W3）
  - name: im
    description: IM 自建 WebSocket 用户签名（M W3）
  - name: upload
    description: 商品图片上传（W7-feature）
  - name: geo
    description: 地址 geocoding（W7 P0-3）
  - name: review
    description: 评论中心（客户评论 + 骑手评价，reviews-2）
  - name: home
    description: 首页活动入口（PromoDock）
  - name: search
    description: 热搜词（Redis ZSET + 运营种子词）
components:
  schemas:
    JwtPayload:
      type: object
      properties:
        sub:
          type: string
          format: uuid
        role:
          type: string
          enum: &a1
            - SUPER_ADMIN
            - CUSTOMER
            - RIDER
            - WAREHOUSE_STAFF
            - CUSTOMER_SERVICE
        deviceType:
          type: string
          enum:
            - client_app
            - rider_app
            - admin_web
            - system
        iat:
          type: integer
        exp:
          type: integer
        jti:
          type: string
          format: uuid
      required:
        - sub
        - role
        - deviceType
        - iat
        - exp
        - jti
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
              pattern: ^E-[A-Z]+-\d{3}$|^E-HTTP-\d{3}$
            message:
              type: string
            details:
              type: object
              additionalProperties:
                nullable: true
          required:
            - code
            - message
      required:
        - success
        - error
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - identifier
        - password
    LoginPasswordRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - phone
        - password
    LoginSmsRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
        smsCode:
          type: string
          minLength: 1
      required:
        - phone
        - smsCode
    LoginResponseData:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            role:
              type: string
              enum: *a1
            phone:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
            avatarUrl:
              type: string
              nullable: true
            status:
              type: string
              enum: &a27
                - ACTIVE
                - SUSPENDED
                - DELETED
          required:
            - id
            - role
            - phone
            - email
            - name
            - avatarUrl
            - status
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - user
        - accessToken
        - refreshToken
    RegisterRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          pattern: "[a-zA-Z]"
        name:
          type: string
        smsCode:
          type: string
      required:
        - phone
        - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
    RefreshResponseData:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
    SendSmsRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - REGISTER
            - LOGIN
            - RESET_PASSWORD
      required:
        - phone
        - type
    SendSmsCodeRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
        scene:
          type: string
          enum: &a28
            - REGISTER
            - LOGIN
            - RESET_PASSWORD
          default: LOGIN
      required:
        - phone
    SendSmsResponseData:
      type: object
      properties:
        expireIn:
          type: integer
          minimum: 0
          exclusiveMinimum: true
      required:
        - expireIn
    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          pattern: "[a-zA-Z]"
      required:
        - email
        - code
        - newPassword
    PasswordResetRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
        smsCode:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          pattern: "[a-zA-Z]"
      required:
        - phone
        - smsCode
        - newPassword
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
          enum: *a1
        status:
          type: string
          enum: &a2
            - ACTIVE
            - SUSPENDED
            - DELETED
        memberLevel:
          type: string
          enum: &a29
            - gold
            - silver
            - bronze
        points:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - phone
        - email
        - name
        - avatarUrl
        - role
        - status
        - createdAt
        - updatedAt
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        avatarUrl:
          type: string
          format: uri
    ChangePasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          pattern: "[a-zA-Z]"
      required:
        - oldPassword
        - newPassword
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        region:
          type: object
          properties:
            province:
              type: string
            city:
              type: string
            district:
              type: string
          required:
            - province
            - city
        detail:
          type: string
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        isDefault:
          type: boolean
        tag:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - phone
        - region
        - detail
        - lat
        - lng
        - isDefault
        - tag
        - createdAt
        - updatedAt
    CreateAddressRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        region:
          type: object
          properties:
            province:
              type: string
            city:
              type: string
            district:
              type: string
          required:
            - province
            - city
        detail:
          type: string
          minLength: 1
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        isDefault:
          type: boolean
        tag:
          type: string
          nullable: true
      required:
        - name
        - phone
        - region
        - detail
    UpdateAddressRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        region:
          type: object
          properties:
            province:
              type: string
            city:
              type: string
            district:
              type: string
          required:
            - province
            - city
        detail:
          type: string
          minLength: 1
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        isDefault:
          type: boolean
        tag:
          type: string
          nullable: true
    FavoriteToggleRequest:
      type: object
      properties:
        productId:
          type: string
          format: uuid
      required:
        - productId
    FavoriteToggleResponse:
      type: object
      properties:
        isFavorite:
          type: boolean
      required:
        - isFavorite
    NotificationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: &a30
            - ORDER_UPDATE
            - PROMOTION
            - SYSTEM
        title:
          type: object
          additionalProperties:
            type: string
        content:
          type: object
          additionalProperties:
            type: string
        isRead:
          type: boolean
        data:
          type: object
          nullable: true
          additionalProperties:
            nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - type
        - title
        - content
        - isRead
        - data
        - createdAt
    MarkNotificationReadResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    AdminUserListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        email:
          type: string
          nullable: true
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
          enum: *a1
        status:
          type: string
          enum: *a2
        phoneVerified:
          type: boolean
        emailVerified:
          type: boolean
        lastLoginAt:
          type: string
          nullable: true
          format: date-time
        createdAt:
          type: string
          format: date-time
        orderCount:
          type: integer
          minimum: 0
        totalSpent:
          type: integer
          minimum: 0
      required:
        - id
        - phone
        - email
        - name
        - avatarUrl
        - role
        - status
        - phoneVerified
        - emailVerified
        - lastLoginAt
        - createdAt
        - orderCount
        - totalSpent
    AdminUserListResponseData:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              phone:
                type: string
              email:
                type: string
                nullable: true
                format: email
              name:
                type: string
                nullable: true
              avatarUrl:
                type: string
                nullable: true
              role:
                type: string
                enum: *a1
              status:
                type: string
                enum: *a2
              phoneVerified:
                type: boolean
              emailVerified:
                type: boolean
              lastLoginAt:
                type: string
                nullable: true
                format: date-time
              createdAt:
                type: string
                format: date-time
              orderCount:
                type: integer
                minimum: 0
              totalSpent:
                type: integer
                minimum: 0
            required:
              - id
              - phone
              - email
              - name
              - avatarUrl
              - role
              - status
              - phoneVerified
              - emailVerified
              - lastLoginAt
              - createdAt
              - orderCount
              - totalSpent
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
      required:
        - items
        - page
        - pageSize
        - total
        - hasMore
    ListUsersQuery:
      type: object
      properties:
        keyword:
          type: string
          maxLength: 100
        role:
          type: string
          enum: &a49
            - SUPER_ADMIN
            - CUSTOMER
            - RIDER
            - WAREHOUSE_STAFF
            - CUSTOMER_SERVICE
        status:
          type: string
          enum: *a2
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    AdminUserDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        email:
          type: string
          nullable: true
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
          enum: *a1
        status:
          type: string
          enum: *a2
        phoneVerified:
          type: boolean
        emailVerified:
          type: boolean
        lastLoginAt:
          type: string
          nullable: true
          format: date-time
        createdAt:
          type: string
          format: date-time
        orderCount:
          type: integer
          minimum: 0
        totalSpent:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        recentOrders:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              orderNo:
                type: string
                pattern: ^MM\d{14}$
              status:
                type: string
                enum: &a3
                  - PENDING_PAYMENT
                  - PENDING_CONFIRM
                  - CONFIRMED
                  - PICKED
                  - OUT_FOR_DELIVERY
                  - DELIVERED_PAID
                  - DELIVERED
                  - DELIVERED_UNPAID
                  - COMPLETED
                  - CANCELLED
              payableAmount:
                type: integer
                minimum: 0
                maximum: 999999
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - orderNo
              - status
              - payableAmount
              - createdAt
          maxItems: 5
        addresses:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              userId:
                type: string
                format: uuid
              name:
                type: string
              phone:
                type: string
              region:
                type: object
                properties:
                  province:
                    type: string
                  city:
                    type: string
                  district:
                    type: string
                required:
                  - province
                  - city
              detail:
                type: string
              lat:
                type: number
                nullable: true
              lng:
                type: number
                nullable: true
              isDefault:
                type: boolean
              tag:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
            required:
              - id
              - userId
              - name
              - phone
              - region
              - detail
              - lat
              - lng
              - isDefault
              - tag
              - createdAt
              - updatedAt
      required:
        - id
        - phone
        - email
        - name
        - avatarUrl
        - role
        - status
        - phoneVerified
        - emailVerified
        - lastLoginAt
        - createdAt
        - orderCount
        - totalSpent
        - updatedAt
        - recentOrders
        - addresses
    UpdateAdminUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          minLength: 5
          maxLength: 20
        email:
          type: string
          nullable: true
          format: email
        avatarUrl:
          type: string
          format: uri
        role:
          type: string
          enum: *a1
        phoneVerified:
          type: boolean
        emailVerified:
          type: boolean
    SuspendUserRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
    ActivateUserRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
    DeleteUserRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
    ResetPasswordResponseData:
      type: object
      properties:
        temporaryPassword:
          type: string
          minLength: 12
          maxLength: 12
        generatedAt:
          type: string
          format: date-time
      required:
        - temporaryPassword
        - generatedAt
    OrderSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNo:
          type: string
          pattern: ^MM\d{14}$
        status:
          type: string
          enum: *a3
        payableAmount:
          type: integer
          minimum: 0
          maximum: 999999
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - orderNo
        - status
        - payableAmount
        - createdAt
    Shop:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: object
          additionalProperties:
            type: string
        logoUrl:
          type: string
          nullable: true
          format: uri
        phone:
          type: string
        address:
          type: string
        status:
          type: string
          enum: &a4
            - ACTIVE
            - INACTIVE
        businessHours:
          type: string
          nullable: true
        announcement:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - logoUrl
        - phone
        - address
        - status
        - businessHours
        - createdAt
        - updatedAt
    UpdateShopRequest:
      type: object
      properties:
        name:
          type: object
          additionalProperties:
            type: string
        logoUrl:
          type: string
          nullable: true
          format: uri
        phone:
          type: string
        address:
          type: string
        status:
          type: string
          enum: *a4
        businessHours:
          type: string
          nullable: true
        announcement:
          type: object
          additionalProperties:
            type: string
    Warehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^W\d{2}$
        name:
          type: object
          additionalProperties:
            type: string
        coverageArea:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
                - Polygon
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  items:
                    type: number
          required:
            - type
            - coordinates
        centerPoint:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
                - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
          required:
            - type
            - coordinates
        centerLat:
          type: number
          nullable: true
        centerLng:
          type: number
          nullable: true
        address:
          type: string
        operatingHours:
          type: object
          nullable: true
          properties:
            mon: &a5
              type: object
              properties:
                open:
                  type: string
                  pattern: ^\d{2}:\d{2}$
                close:
                  type: string
                  pattern: ^\d{2}:\d{2}$
              required:
                - open
                - close
            tue: *a5
            wed: *a5
            thu: *a5
            fri: *a5
            sat: *a5
            sun: *a5
        deliveryFee:
          type: integer
          minimum: 0
          maximum: 999999
          default: 0
        isActive:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - name
        - coverageArea
        - centerPoint
        - centerLat
        - centerLng
        - address
        - operatingHours
        - createdAt
        - updatedAt
    UpsertWarehouseRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^W\d{2}$
        name:
          type: object
          additionalProperties:
            type: string
        coverageArea:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
                - Polygon
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  items:
                    type: number
          required:
            - type
            - coordinates
        centerLat:
          type: number
        centerLng:
          type: number
        address:
          type: string
        operatingHours:
          type: object
          nullable: true
          properties:
            mon: &a6
              type: object
              properties:
                open:
                  type: string
                  pattern: ^\d{2}:\d{2}$
                close:
                  type: string
                  pattern: ^\d{2}:\d{2}$
              required:
                - open
                - close
            tue: *a6
            wed: *a6
            thu: *a6
            fri: *a6
            sat: *a6
            sun: *a6
        deliveryFee:
          type: integer
          minimum: 0
          maximum: 999999
        isActive:
          type: boolean
      required:
        - name
        - coverageArea
        - centerLat
        - centerLng
        - address
        - operatingHours
        - deliveryFee
        - isActive
    MatchWarehouseRequest:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        categoryId:
          type: string
          nullable: true
          format: uuid
        categoryName:
          type: object
          nullable: true
          additionalProperties:
            type: string
        name:
          type: object
          additionalProperties:
            type: string
        description:
          type: object
          nullable: true
          additionalProperties:
            type: string
        mainImage:
          type: string
        images:
          type: array
          items:
            type: string
        status:
