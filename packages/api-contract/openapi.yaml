                        pattern: ^E-[A-Z]+-\d{3}$|^E-HTTP-\d{3}$
                      message:
                        type: string
                      details:
                        type: object
                        additionalProperties:
                          nullable: true
                    required:
                      - code
                      - message
                required:
                  - success
                  - error
        "404":
          description: PHONE_NOT_FOUND
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        pattern: ^E-[A-Z]+-\d{3}$|^E-HTTP-\d{3}$
                      message:
                        type: string
                      details:
                        type: object
                        additionalProperties:
                          nullable: true
                    required:
                      - code
                      - message
                required:
                  - success
                  - error
