      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  minLength: 1
                smsCode:
                  type: string
                  minLength: 1
                newPassword:
                  type: string
                  minLength: 8
                  pattern: "[a-zA-Z]"
              required:
                - phone
                - smsCode
                - newPassword
      responses:
        "200":
          description: 重置成功
