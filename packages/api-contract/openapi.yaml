                    default: websocket
                  authScheme:
                    type: string
                    enum: *a47
                  userId:
                    type: string
                    minLength: 1
                  role:
                    type: string
                    enum: *a48
                  serverEvents:
                    type: array
                    items:
                      type: string
                    minItems: 1
                  clientEvents:
                    type: array
                    items:
                      type: string
                    minItems: 1
                  conversationFormats:
                    type: object
                    properties:
                      customerMerchant:
                        type: object
                        properties:
                          template:
                            type: string
                            minLength: 1
                          placeholders:
                            type: array
                            items:
                              type: string
                            minItems: 1
                        required:
                          - template
                          - placeholders
                      customerRider:
                        type: object
                        properties:
                          template:
                            type: string
                            minLength: 1
                          placeholders:
                            type: array
                            items:
                              type: string
                            minItems: 1
                        required:
                          - template
                          - placeholders
                      customerService:
                        type: object
                        properties:
                          template:
                            type: string
                            minLength: 1
                          placeholders:
                            type: array
                            items:
                              type: string
                            minItems: 1
                        required:
                          - template
                          - placeholders
                    required:
                      - customerMerchant
                      - customerRider
                      - customerService
                  serverTime:
                    type: string
                    format: date-time
                  messageRetentionDays:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                required:
                  - url
                  - namespace
                  - authScheme
                  - userId
                  - role
                  - serverEvents
                  - clientEvents
                  - conversationFormats
                  - serverTime
                  - messageRetentionDays
