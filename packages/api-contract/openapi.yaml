                    properties:
                      id:
                        type: string
                        format: uuid
                      role:
                        type: string
                        enum: *a1
                      phone:
                        type: string
                        nullable: true
                      email:
                        type: string
                        nullable: true
                      name:
                        type: string
                        nullable: true
                      avatarUrl:
                        type: string
                        nullable: true
                      status:
                        type: string
