name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一 PR 多次 push 时取消旧 run（节省 CI 资源）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + Test + Coverage + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # e2e 空转修复（2026-11-23）：此前 CI 无 services，e2e-guard 探活 /health 不通 →
    # 7 个 e2e-*.test.ts 100% skip（SKIP ≠ 通过）。现起 postgres+redis 真容器，
    # 并在 e2e 步骤前 migrate deploy + seed + 起 API dev server，e2e 真跑。
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meimart_ci
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d meimart_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # e2e 用（API dev server 读 .env 之外由 workflow 显式注入，避免依赖 repo secrets）
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meimart_ci?schema=public
      REDIS_URL: redis://localhost:6379
      # 必须显式 development：mock-login 路由仅在 NODE_ENV=development/test 注册，
      # 不设则 e2e 全链 401/Cannot POST（本地 dev script 靠 tsx watch 场景默认值掩盖）
      NODE_ENV: development
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-chars
      # e2e sms:ip/sms:phone 桶豁免（rate-limit.guard 既有开关，NODE_ENV 非 production 才生效；
      # CI 无固定 IP，20 次/小时桶一轮 e2e 必打满自毒化）。仅 CI env，不进生产清单
      E2E_RATELIMIT_BYPASS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version 从 package.json 的 packageManager 字段自动读取（pnpm@11.8.0）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client（src/prisma/client 被 gitignore，CI 必须生成）
        run: pnpm --filter @meimart/api exec prisma generate
      - name: Typecheck all workspaces
        run: pnpm -r typecheck
      - name: Run all tests
        run: pnpm -r test
      - name: Coverage（api 单测，显式 exclude e2e 与 baseline 同口径；thresholds 见 vitest.config.ts）
        # D3 baseline（实测 69.3/66.55/62/69.53 下浮 1pt）：statements 68 / branches 65 / functions 61 / lines 68
        # 70 为目标值，提升后逐步上调 thresholds
        run: pnpm --filter @meimart/api exec vitest run --coverage --exclude '**/e2e-*.test.ts'
      - name: e2e（CI 起 postgres+redis services 后真跑；upload-thumbnail 无 OSS env 时由内部守卫自 skip，不算红）
        # test:e2e 内置 --reporter=verbose：真实执行计数在 verbose 输出可见
        run: |
          pnpm --filter @meimart/api exec prisma migrate deploy
          pnpm --filter @meimart/api db:seed
          pnpm --filter @meimart/api dev &   # 后台起 API（PORT 默认 3000）
          node -e "const t=Date.now();(function p(){fetch('http://localhost:3000/health').then(r=>{if(r.ok){console.log('API up');process.exit(0)}throw 0}).catch(()=>{if(Date.now()-t>60000){console.error('API 未就绪超时');process.exit(1)}setTimeout(p,1000)})})()"
          pnpm --filter @meimart/api run test:e2e

  contract:
    name: Contract Consistency (zod → OpenAPI → TS types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version 从 package.json 的 packageManager 字段自动读取（pnpm@11.8.0）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client（contract job 也需要）
        run: pnpm --filter @meimart/api exec prisma generate
      - name: Regenerate OpenAPI from zod
        run: pnpm --filter @meimart/api-contract gen:openapi
      - name: Regenerate TS types from OpenAPI
        run: pnpm --filter @meimart/shared-types gen:types
      - name: Verify generated files are up-to-date
        run: |
          if ! git diff --exit-code; then
            echo "❌ Generated files are out of date. Run:"
            echo "   pnpm --filter @meimart/api-contract gen:openapi"
            echo "   pnpm --filter @meimart/shared-types gen:types"
            echo "   Then commit the changes."
            exit 1
          fi
          echo "✅ Generated files are up-to-date"

  security:
    name: Dependency Audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version 从 package.json 的 packageManager 字段自动读取（pnpm@11.8.0）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit for high/critical vulnerabilities (allowlist-aware)
        # P1-9：audit:gate = pnpm audit --json → scripts/gate/audit-check.mjs 过滤
        # 存量记账（scripts/gate/audit-allowlist.json，以 entries 实际数量为准：
        # admin-web next 大版本升级另行立项 +
        # 构建/开发期工具链传递依赖）不拦截；新增 advisory 未登记 → exit 1 硬门
        run: pnpm audit:gate

  build:
    name: Build (api + admin-web)
    runs-on: ubuntu-latest
    needs: [quality, contract, security]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version 从 package.json 的 packageManager 字段自动读取（pnpm@11.8.0）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client（build 也需要类型）
        run: pnpm --filter @meimart/api exec prisma generate
      - name: Build API (NestJS)
        run: pnpm --filter @meimart/api build
      - name: Build admin-web (Next.js)
        run: pnpm --filter @meimart/admin-web build
        env:
          # Next.js build 不需要真实 DATABASE_URL（只是静态构建）
          NEXT_TELEMETRY_DISABLED: '1'
