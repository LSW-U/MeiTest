name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一 PR 多次 push 时取消旧 run（节省 CI 资源）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + Test + Coverage + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version 从 package.json 的 packageManager 字段自动读取（pnpm@11.8.0）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client（src/prisma/client 被 gitignore，CI 必须生成）
        run: pnpm --filter @meimart/api exec prisma generate
      - name: Typecheck all workspaces
        run: pnpm -r typecheck
      - name: Run all tests
        run: pnpm -r test
      - name: Coverage（api 单测，显式 exclude e2e 与 baseline 同口径；thresholds 见 vitest.config.ts）
        # D3 baseline（实测 69.3/66.55/62/69.53 下浮 1pt）：statements 68 / branches 65 / functions 61 / lines 68
        # 70 为目标值，提升后逐步上调 thresholds
        run: pnpm --filter @meimart/api exec vitest run --coverage --exclude '**/e2e-*.test.ts'
      - name: e2e（API 离线时由 e2e-guard 显式打印 skip 计数后跳过，不算红）
        # test:e2e 内置 --reporter=verbose：e2e-guard 的 SKIP suite #n 计数行在 CI 默认输出可见
        run: pnpm --filter @meimart/api run test:e2e

  contract:
    name: Contract Consistency (zod → OpenAPI → TS types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version 从 package.json 的 packageManager 字段自动读取（pnpm@11.8.0）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client（contract job 也需要）
        run: pnpm --filter @meimart/api exec prisma generate
      - name: Regenerate OpenAPI from zod
        run: pnpm --filter @meimart/api-contract gen:openapi
      - name: Regenerate TS types from OpenAPI
        run: pnpm --filter @meimart/shared-types gen:types
      - name: Verify generated files are up-to-date
        run: |
          if ! git diff --exit-code; then
            echo "❌ Generated files are out of date. Run:"
            echo "   pnpm --filter @meimart/api-contract gen:openapi"
            echo "   pnpm --filter @meimart/shared-types gen:types"
            echo "   Then commit the changes."
            exit 1
          fi
          echo "✅ Generated files are up-to-date"

  security:
    name: Dependency Audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version 从 package.json 的 packageManager 字段自动读取（pnpm@11.8.0）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit for high/critical vulnerabilities (allowlist-aware)
        # P1-9：audit:gate = pnpm audit --json → scripts/gate/audit-check.mjs 过滤
        # 存量记账（scripts/gate/audit-allowlist.json，88 条：admin-web next 大版本升级另行立项 +
        # 构建/开发期工具链传递依赖）不拦截；新增 advisory 未登记 → exit 1 硬门
        run: pnpm audit:gate

  build:
    name: Build (api + admin-web)
    runs-on: ubuntu-latest
    needs: [quality, contract, security]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version 从 package.json 的 packageManager 字段自动读取（pnpm@11.8.0）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client（build 也需要类型）
        run: pnpm --filter @meimart/api exec prisma generate
      - name: Build API (NestJS)
        run: pnpm --filter @meimart/api build
      - name: Build admin-web (Next.js)
        run: pnpm --filter @meimart/admin-web build
        env:
          # Next.js build 不需要真实 DATABASE_URL（只是静态构建）
          NEXT_TELEMETRY_DISABLED: '1'
